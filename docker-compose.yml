services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REPORTS_DIR=/app/data/reports
      - ENABLE_SHARING=${ENABLE_SHARING:-true}
      - GH_TOKEN_FOR_SCAN=${GH_TOKEN_FOR_SCAN:-}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
      - SITE_ORIGIN=${SITE_ORIGIN:-http://localhost:8080}
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: webapp/frontend/Dockerfile
      args:
        ENABLE_SHARING: ${ENABLE_SHARING:-true}
        FRONTEND_API_ORIGIN: ${FRONTEND_API_ORIGIN:-http://localhost:3000}
        PUBLIC_APPLICATIONINSIGHTS_CONNECTION_STRING: ${PUBLIC_APPLICATIONINSIGHTS_CONNECTION_STRING:-}
        SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:8080}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
