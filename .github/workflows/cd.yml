name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: is-ai-native-production
  cancel-in-progress: true

# Required for OIDC-based Azure login (no long-lived credentials)
permissions:
  id-token: write   # Exchange OIDC token for Azure access token
  contents: read    # Checkout code
  packages: write   # Push image to GitHub Container Registry
  security-events: write  # Upload Trivy SARIF results
  actions: read     # Required by codeql-action/upload-sarif

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MONITORING_ALERT_EMAIL: salnikov@gmail.com
  # Update these to match your Azure environment
  AZURE_RESOURCE_GROUP: is-ai-native-rg
  AZURE_LOCATION: eastus2
  STATIC_WEB_APP_NAME: is-ai-native-frontend

jobs:
  # ── Build & push container image to GHCR ──────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
      immutable_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security scan the pushed image ────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 — pinned to immutable SHA
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results-cd
          path: trivy-results.sarif
          if-no-files-found: ignore

  # ── Deploy backend to ACA and frontend to Static Web Apps ─────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build-push, security-scan]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC — no stored credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Static Web Apps production cutover
        shell: bash
        env:
          PUBLIC_SITE_ORIGIN: ${{ vars.SITE_ORIGIN || secrets.SITE_ORIGIN }}
          STATIC_WEB_APP_CUSTOM_DOMAIN_NAME: ${{ vars.STATIC_WEB_APP_CUSTOM_DOMAIN_NAME || secrets.STATIC_WEB_APP_CUSTOM_DOMAIN_NAME }}
        run: |
          set -euo pipefail

          if [[ -z "$PUBLIC_SITE_ORIGIN" || -z "$STATIC_WEB_APP_CUSTOM_DOMAIN_NAME" ]]; then
            echo "SITE_ORIGIN and STATIC_WEB_APP_CUSTOM_DOMAIN_NAME must be configured before deploying the API-only backend."
            exit 1
          fi

          if [[ "$PUBLIC_SITE_ORIGIN" != "https://$STATIC_WEB_APP_CUSTOM_DOMAIN_NAME" ]]; then
            echo "SITE_ORIGIN must match the validated Static Web Apps custom domain."
            exit 1
          fi

          bound_hostname_count=$(az staticwebapp hostname list \
            --name "${{ env.STATIC_WEB_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[?domainName=='$STATIC_WEB_APP_CUSTOM_DOMAIN_NAME' && status=='Ready'] | length(@)" \
            --output tsv)

          if [[ "$bound_hostname_count" != "1" ]]; then
            echo "$STATIC_WEB_APP_CUSTOM_DOMAIN_NAME is not bound to ${{ env.STATIC_WEB_APP_NAME }}."
            exit 1
          fi

          curl --fail --show-error --silent \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            "$PUBLIC_SITE_ORIGIN/runtime-config.js" \
            | grep -F "azurecontainerapps.io"

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ env.AZURE_RESOURCE_GROUP }}" \
            --location "${{ env.AZURE_LOCATION }}" \
            --tags application=is-ai-native managedBy=github-actions \
            --output none

      - name: Deploy / update Azure infrastructure
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          # NOTE: .bicepparam files cannot be mixed with inline overrides.
          # Manual deploy defaults live in infra/main.bicepparam, but this workflow
          # is the production source of truth because it passes its own overrides.
          # Keep the ACA scaled to zero until production traffic justifies an idle replica.
          # Change this override to containerStartupStrategy=keep-warm for faster startup.
          parameters: >
            containerImage=${{ needs.build-push.outputs.immutable_image }}
            githubToken=${{ secrets.GH_TOKEN_FOR_SCAN }}
            enableSharing=true
            enableAvailabilityMonitoring=true
            containerStartupStrategy=scale-to-zero
            monitoringAlertEmail=${{ secrets.MONITORING_ALERT_EMAIL != '' && secrets.MONITORING_ALERT_EMAIL || env.MONITORING_ALERT_EMAIL }}
            monitoringUrl=${{ vars.SITE_ORIGIN || secrets.SITE_ORIGIN }}
            siteOrigin=${{ vars.SITE_ORIGIN || secrets.SITE_ORIGIN }}
            staticWebAppCustomDomainName=${{ vars.STATIC_WEB_APP_CUSTOM_DOMAIN_NAME || secrets.STATIC_WEB_APP_CUSTOM_DOMAIN_NAME }}
            staticWebAppDomainValidationMethod=${{ vars.STATIC_WEB_APP_DOMAIN_VALIDATION_METHOD || 'dns-txt-token' }}
          failOnStdErr: false

      - name: Resolve frontend build telemetry configuration
        id: frontend-config
        shell: bash
        env:
          APP_INSIGHTS_NAME: ${{ steps.bicep.outputs.appInsightsName }}
        run: |
          set -euo pipefail

          app_insights_connection_string=""
          if [[ -n "$APP_INSIGHTS_NAME" ]]; then
            app_insights_connection_string=$(az monitor app-insights component show \
              --app "$APP_INSIGHTS_NAME" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query connectionString \
              --output tsv)
          fi

          if [[ -n "$app_insights_connection_string" ]]; then
            echo "::add-mask::$app_insights_connection_string"
          fi

          echo "app_insights_connection_string=$app_insights_connection_string" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build static frontend
        run: npm run build:frontend
        env:
          ENABLE_SHARING: true
          FRONTEND_API_ORIGIN: ${{ steps.bicep.outputs.backendUrl }}
          PUBLIC_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ steps.frontend-config.outputs.app_insights_connection_string }}
          SITE_ORIGIN: ${{ steps.bicep.outputs.appUrl }}

      - name: Get Static Web Apps deployment token
        id: static-web-app-token
        shell: bash
        env:
          STATIC_WEB_APP_RESOURCE_ID: ${{ steps.bicep.outputs.staticWebAppResourceId }}
        run: |
          set -euo pipefail

          deployment_token=$(az rest \
            --method post \
            --uri "${STATIC_WEB_APP_RESOURCE_ID}/listSecrets?api-version=2023-12-01" \
            --query properties.apiKey \
            --output tsv)

          if [[ -z "$deployment_token" || "$deployment_token" == "null" ]]; then
            echo "Azure returned an empty Static Web Apps deployment token"
            exit 1
          fi

          echo "::add-mask::$deployment_token"
          echo "token=$deployment_token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static-web-app-token.outputs.token }}
          action: upload
          app_location: webapp/frontend/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Print application URLs
        run: |
          echo "Frontend: ${{ steps.bicep.outputs.staticWebAppUrl }}"
          echo "Backend:  ${{ steps.bicep.outputs.backendUrl }}"

      - name: Install Azure Container Apps CLI extension
        run: |
          az extension add --name containerapp --upgrade --allow-preview true

      - name: Wait for latest revision to become healthy
        id: revision-health
        shell: bash
        env:
          CONTAINER_APP_NAME: ${{ steps.bicep.outputs.containerAppName }}
        run: |
          set -euo pipefail

          latest_revision=""
          for attempt in {1..30}; do
            latest_revision=$(az containerapp revision list \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "sort_by(@, &properties.createdTime)[-1].name" \
              -o tsv)

            if [[ -n "$latest_revision" ]]; then
              echo "Latest revision: $latest_revision"
              echo "latest_revision=$latest_revision" >> "$GITHUB_OUTPUT"
              break
            fi

            sleep 10
          done

          if [[ -z "$latest_revision" ]]; then
            echo "No revision found after deployment"
            exit 1
          fi

          for attempt in {1..36}; do
            provisioning_state=$(az containerapp revision show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --revision "$latest_revision" \
              --query "properties.provisioningState" \
              -o tsv)

            running_state=$(az containerapp revision show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --revision "$latest_revision" \
              --query "properties.runningState" \
              -o tsv)

            active=$(az containerapp revision show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --revision "$latest_revision" \
              --query "properties.active" \
              -o tsv)

            replicas=$(az containerapp revision show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --revision "$latest_revision" \
              --query "properties.replicas" \
              -o tsv)

            echo "Attempt $attempt: provisioning=$provisioning_state running=$running_state active=$active replicas=${replicas:-0}"

            if [[ "$provisioning_state" == "Provisioned" && "$running_state" == "Running" && "$active" == "true" && "${replicas:-0}" != "0" ]]; then
              exit 0
            fi

            if [[ "$provisioning_state" == "Provisioning failed" || "$running_state" == "Failed" || "$running_state" == "Degraded" || "$running_state" == "Activation failed" ]]; then
              echo "Revision entered unhealthy state"
              exit 1
            fi

            sleep 10
          done

          echo "Revision did not become healthy in time"
          exit 1

      - name: Smoke test deployed endpoints
        shell: bash
        env:
          BACKEND_URL: ${{ steps.bicep.outputs.backendUrl }}
          FRONTEND_URL: ${{ steps.bicep.outputs.staticWebAppUrl }}
        run: |
          set -euo pipefail

          echo "Backend health check: $BACKEND_URL/api/health"
          curl --fail --show-error --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            "$BACKEND_URL/api/health"

          echo "Frontend homepage check: $FRONTEND_URL/"
          curl --fail --show-error --silent \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            "$FRONTEND_URL/" > /tmp/homepage.html

          grep -q "github.com/" /tmp/homepage.html

          echo "Frontend runtime configuration check"
          curl --fail --show-error --silent \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            "$FRONTEND_URL/runtime-config.js" > /tmp/runtime-config.js

          grep -Fq "$BACKEND_URL" /tmp/runtime-config.js

          echo "ACA CORS preflight check"
          curl --fail --show-error --silent \
            --request OPTIONS \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            --dump-header /tmp/cors-headers.txt \
            --output /dev/null \
            --header "Origin: $FRONTEND_URL" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type" \
            "$BACKEND_URL/api/scan"

          grep -Fiq "access-control-allow-origin: $FRONTEND_URL" /tmp/cors-headers.txt

          echo "WebMCP demo page check: $FRONTEND_URL/_webmcp_/"
          curl --fail --show-error --silent \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            "$FRONTEND_URL/_webmcp_/" > /tmp/webmcp.html

          # The demo page loads its own module and form; the SPA fallback would not.
          grep -q "webmcp-page.js" /tmp/webmcp.html
          grep -q "webmcp-demo-form" /tmp/webmcp.html

          for asset in /favicon.ico /favicon.svg /favicon-32x32.png /favicon-16x16.png /social-card.png /social-card.svg; do
            echo "Static asset check: $FRONTEND_URL$asset"
            headers=$(curl --fail --show-error --silent --head \
              --retry 6 \
              --retry-all-errors \
              --retry-delay 10 \
              "$FRONTEND_URL$asset")

            echo "$headers" | grep -i "^cross-origin-resource-policy: cross-origin"
          done

      - name: Dump Azure diagnostics on failed deployment validation
        if: failure()
        shell: bash
        env:
          CONTAINER_APP_NAME: ${{ steps.bicep.outputs.containerAppName }}
        run: |
          set +e

          echo "Container app summary"
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --output jsonc

          echo "Revision summary"
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --output table

          if [[ -n "${{ steps.revision-health.outputs.latest_revision }}" ]]; then
            echo "Replica summary"
            az containerapp replica list \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --revision "${{ steps.revision-health.outputs.latest_revision }}" \
              --output table
          fi
